<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Korugan — AI-native edge security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="0.55" stop-color="#0d1730"/>
      <stop offset="1" stop-color="#091422"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#155e75" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#155e75" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#164e63"/>
      <stop offset="1" stop-color="#0e3a4d"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1e3a5f" stroke-width="1" opacity="0.25">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200"/>
    <path d="M200 0 V300 M400 0 V300 M600 0 V300 M800 0 V300 M1000 0 V300"/>
  </g>

  <!-- bunker / shield mark -->
  <g transform="translate(150,150)">
    <polygon points="0,-92 80,-46 80,46 0,92 -80,46 -80,-46" fill="url(#shield)" stroke="#22d3ee" stroke-width="3"/>
    <polygon points="0,-64 56,-32 56,32 0,64 -56,32 -56,-32" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>
    <!-- embrasure slit -->
    <rect x="-34" y="-10" width="68" height="20" rx="10" fill="#0a1020" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="6" fill="#f59e0b"/>
    <!-- radar sweep -->
    <path d="M0,0 L58,-38" stroke="#22d3ee" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="46" fill="none" stroke="#22d3ee" stroke-width="1" opacity="0.35"/>
  </g>

  <!-- wordmark -->
  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="300" y="158" font-size="84" font-weight="800" letter-spacing="14" fill="#e8f4fb">KORUGAN</text>
    <text x="304" y="204" font-size="24" letter-spacing="2.5" fill="#7dd3fc">AI-NATIVE EDGE SECURITY</text>
    <text x="304" y="240" font-size="17" letter-spacing="1" fill="#8aa3b8">watch the edge · explain the noise · fix with consent</text>
  </g>

  <rect x="300" y="172" width="560" height="3" fill="url(#edge)"/>
  <rect x="0" y="297" width="1200" height="3" fill="url(#edge)" opacity="0.6"/>
</svg>
