services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: korugan
      POSTGRES_PASSWORD: korugan-dev
      POSTGRES_DB: korugan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U korugan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
